# Abonnements App Store (I6) créés par l'API App Store Connect (scripts/store-subscriptions.mjs) : groupe « Halcya »,
# Gold mensuel (9,99 €), Silver annuel (29,99 €, essai gratuit de 2 semaines) et Silver mensuel (4,99 €), en France,
# comme sur Google Play. Ne crée que ce qui manque ; un prix, un niveau ou un essai déjà en place n'est jamais modifié
# (écart signalé). Rien n'est soumis à l'examen d'Apple (geste du propriétaire). Lancement manuel, sur main seulement
# (environnement `appstore` : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, jamais affichés).
name: Abonnements App Store — création

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-push
  cancel-in-progress: false

jobs:
  subscriptions:
    name: Groupe et abonnements (France, euros)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: appstore
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du script
        run: node --test scripts/store-subscriptions.test.mjs
      - name: Création (API App Store Connect)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/store-subscriptions.mjs
