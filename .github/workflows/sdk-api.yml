# Diagnostic (temporaire) : déclarations publiques d'une API d'Apple telles que le SDK d'Xcode les voit, quand la
# documentation en ligne et le compilateur ne s'accordent pas (temps d'écran, I8, 31/10). Aucune donnée, aucun secret.
name: iOS — API du SDK (diagnostic)

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/sdk-api.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: DeviceActivity et FamilyControls (interfaces Swift du SDK iOS)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for fw in DeviceActivity FamilyControls; do
            f="$(find "$SDK/System/Library/Frameworks/$fw.framework" -name 'arm64e-apple-ios.swiftinterface' -o -name 'arm64-apple-ios.swiftinterface' | head -1)"
            echo "::group::$fw ($f)"
            if [ "$fw" = DeviceActivity ]; then
              sed -n '200,330p' "$f"
              echo "--- fichiers du SDK qui déclarent activitySegments :"
              grep -rl --include='*.swiftinterface' 'activitySegments' "$SDK" | grep -E 'arm64e-apple-ios|arm64-apple-ios' | head
              for g in $(grep -rl --include='arm64e-apple-ios.swiftinterface' 'activitySegments' "$SDK" | head -3); do
                echo "=== $g"
                head -15 "$g"
                grep -n -E "activitySegments|DeviceActivityResults|categories|applications|numberOfPickups|AsyncSequence|totalPickups" "$g" | head -40
                n="$(grep -n 'public struct DeviceActivityResults' "$g" | head -1 | cut -d: -f1)"
                [ -n "$n" ] && sed -n "$((n - 6)),$((n + 40))p" "$g"
              done
            else
              grep -n -E "approvedWithDataAccess|requestAuthorization|authorizationStatus" "$f" | head -20
            fi
            echo "::endgroup::"
          done
