# Diagnostic (temporaire) : déclarations publiques d'une API d'Apple telles que le SDK d'Xcode les voit, quand la
# documentation en ligne et le compilateur ne s'accordent pas (temps d'écran, I8, 31/10). Aucune donnée, aucun secret.
name: iOS — API du SDK (diagnostic)

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/sdk-api.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Recouvrement SwiftUI de DeviceActivity
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ls -la "$(dirname "$SDK")"
          find -L "$SDK" -maxdepth 6 -iname '*_DeviceActivity_SwiftUI*' 2>/dev/null | head
          g="$(find -L "$SDK" -path '*_DeviceActivity_SwiftUI*' -name 'arm64e-apple-ios.swiftinterface' 2>/dev/null | head -1)"
          echo "=== $g"
          [ -n "$g" ] && grep -n -E "^import|activitySegments|DeviceActivityResults|categories|applications|AsyncSequence|AsyncIterator|func next" "$g" | head -60
      - name: Vérification de type du code du plugin
        run: |
          mkdir -p /tmp/essai && cat > /tmp/essai/lecture.swift <<'SWIFT'
          import DeviceActivity
          import Foundation
          import SwiftUI

          @available(iOS 26.4, *)
          func lire(_ start: Date, _ end: Date) async throws -> [[String: Any]] {
              let filter = DeviceActivityFilter(segment: .hourly(during: DateInterval(start: start, end: end)), users: .all, devices: .init([.iPhone]))
              var segments: [[String: Any]] = []
              for try await data in DeviceActivityData.activityData(filteredBy: filter) {
                  for await segment in data.activitySegments {
                      var pickups = segment.totalPickupsWithoutApplicationActivity
                      for await category in segment.categories {
                          for await app in category.applications {
                              pickups += app.numberOfPickups
                          }
                      }
                      var item: [String: Any] = [
                          "start": segment.dateInterval.start.timeIntervalSince1970 * 1000,
                          "activeMs": segment.totalActivityDuration * 1000,
                          "pickups": pickups,
                      ]
                      if let first = segment.firstPickup { item["firstPickup"] = first.timeIntervalSince1970 * 1000 }
                      segments.append(item)
                  }
              }
              return segments
          }
          SWIFT
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios17.0 /tmp/essai/lecture.swift && echo "TYPECHECK OK"
