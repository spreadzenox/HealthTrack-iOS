# Diagnostic (temporaire) : déclarations publiques d'une API d'Apple telles que le SDK d'Xcode les voit, quand la
# documentation en ligne et le compilateur ne s'accordent pas (temps d'écran, I8, 31/10). Aucune donnée, aucun secret.
name: iOS — API du SDK (diagnostic)

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/sdk-api.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: DeviceActivity et FamilyControls (interfaces Swift du SDK iOS)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for fw in DeviceActivity FamilyControls; do
            f="$(find "$SDK/System/Library/Frameworks/$fw.framework" -name 'arm64e-apple-ios.swiftinterface' -o -name 'arm64-apple-ios.swiftinterface' | head -1)"
            echo "::group::$fw ($f)"
            if [ "$fw" = DeviceActivity ]; then
              echo "--- recouvrements (cross-import) :"
              find "$SDK/System/Library/Frameworks/DeviceActivity.framework" -maxdepth 3 | head -30
              find "$SDK/System/Library/Frameworks/DeviceActivity.framework" -name '*.swiftoverlay' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
              echo "--- tout fichier du SDK qui contient activitySegments :"
              grep -rl 'activitySegments' "$SDK" 2>/dev/null | head -20
              find "$SDK" -iname '*DeviceActivity*' -maxdepth 6 | grep -v '/DeviceActivity.framework/' | head -20
              for g in $(grep -rl --include='*.swiftinterface' 'activitySegments' "$SDK" 2>/dev/null | head -2); do
                echo "=== $g"
                grep -n -E "^import|activitySegments|DeviceActivityResults|categories|applications|AsyncSequence" "$g" | head -40
              done
            else
              grep -n -E "approvedWithDataAccess|requestAuthorization|authorizationStatus" "$f" | head -20
            fi
            echo "::endgroup::"
          done
