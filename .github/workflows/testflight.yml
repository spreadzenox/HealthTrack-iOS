# Envoi de Halcya sur TestFlight (I9), après les actions A1 à A3 du propriétaire et son accord du 30/10 pour la
# signature par Apple (A2) : archive de la variante appstore (sans mode captures), signée à l'export par un certificat
# de distribution géré par Apple, puis envoyée à App Store Connect. Aucun certificat ni profil dans le dépôt ou les
# secrets : seule la clé API App Store Connect (rôle Admin) est rangée dans l'environnement `appstore`, réservé à
# main (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), écrite le temps du job dans un fichier effacé à la fin.
# L'archive n'est pas signée par Apple : une signature ad hoc garde les entitlements (HealthKit) pour l'export, sans
# créer de certificat de développement à chaque passage (la limite du compte serait vite atteinte).
name: iOS — TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive signée et envoi sur TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    environment: appstore
    env:
      TEAM_ID: 67R69L355R # identifiant d'équipe Apple : public, il figure dans toute app signée
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # numéro de build = <version Android>.<nombre de commits de ce dépôt>
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Clé API App Store Connect (jamais affichée)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Secret $name absent de l'environnement appstore"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          grep -q -- "-----BEGIN PRIVATE KEY-----" "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            || { echo "::error::ASC_KEY_P8 doit contenir tout le fichier .p8, lignes BEGIN et END comprises"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Code Android suivi + adaptations iOS
        run: scripts/upstream.sh
      - name: Modèles du visage (téléchargés et vérifiés)
        run: scripts/face-models.sh
      - name: Numéros de version
        run: |
          ANDROID="$(node -p "require('./upstream.json').versionCode")"
          echo "ANDROID_VERSION=$ANDROID" >> "$GITHUB_ENV"
          echo "IOS_BUILD=$ANDROID.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Version $ANDROID, build $ANDROID.$(git rev-list --count HEAD)"
          xcodebuild -version
      - name: Build web (variante appstore, sans mode captures) et synchronisation Capacitor
        working-directory: upstream/app
        env:
          VITE_DISTRIBUTION: appstore
        run: |
          npm ci --no-audit --no-fund
          CORE="$(node -p "require('@capacitor/core/package.json').version")"
          npm install --no-save --no-audit --no-fund "@capacitor/ios@$CORE"
          VITE_APP_VERSION="$ANDROID_VERSION" npm run build
          # Le mode captures (sondes, écriture dans Santé) n'est compilé qu'avec VITE_IOS_CAPTURE=1 : jamais ici
          if grep -rq "\[healthkit\] base" dist; then echo "::error::mode captures présent dans la build"; exit 1; fi
          npx -y -p "@capacitor/cli@$CORE" cap sync ios
      - name: Archive (signature ad hoc, entitlements gardés pour l'export)
        working-directory: upstream/app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Halcya.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$ANDROID_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER= \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
          codesign -d --entitlements - "$RUNNER_TEMP/Halcya.xcarchive/Products/Applications/App.app" 2>&1 \
            | tee "$RUNNER_TEMP/archive-entitlements.txt" | grep -q "com.apple.developer.healthkit"
      - name: Options d'export (App Store Connect, signature automatique)
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/export-options.plist"
      - name: Export signé par Apple (certificat de distribution géré par Apple)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Halcya.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"
      - name: Vérification de l'app signée (entitlements, version, phrases de l'app livrée)
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)"
          codesign -d --entitlements - "$APP" 2>&1 | tee "$RUNNER_TEMP/ipa-entitlements.txt"
          grep -q "com.apple.developer.healthkit" "$RUNNER_TEMP/ipa-entitlements.txt"
          if grep -A2 "get-task-allow" "$RUNNER_TEMP/ipa-entitlements.txt" | grep -q true; then
            echo "::error::app signée en développement (get-task-allow)"; exit 1
          fi
          codesign -dv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier)=" | head -3
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$ANDROID_VERSION" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$IOS_BUILD" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "fr.jpesquet.sante" ]
          # Phrase d'écriture exigée par Apple (le plugin Santé contient l'écriture) : celle de l'app livrée, qui dit que
          # Halcya n'écrit rien, jamais celle de la build de captures
          /usr/libexec/PlistBuddy -c 'Print :NSHealthUpdateUsageDescription' "$APP/Info.plist" | grep -q "n’écrit rien"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist" | grep -qx false
      - name: Envoi sur App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed -i '' 's#<string>export</string>#<string>upload</string>#' "$RUNNER_TEMP/export-options.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Halcya.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log" | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/upload.log"
          echo "### Envoyé sur TestFlight : version $ANDROID_VERSION, build $IOS_BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "Traitement par Apple : 10 à 30 min, puis la build apparaît dans App Store Connect › TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Journaux (sans secret)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/archive-entitlements.txt
            ${{ runner.temp }}/ipa-entitlements.txt
          if-no-files-found: ignore
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
