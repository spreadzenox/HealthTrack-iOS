# Fiche App Store fr-FR (store/app-store/) : limites d'App Store Connect et directive 2.3.10 d'Apple, vérifiées sans
# runner macOS (scripts/store-check.mjs), et tests de l'envoi par l'API App Store Connect (scripts/store-push.mjs,
# lancé par store-push.yml).
name: Fiche App Store — contrôle

on:
  pull_request:
    branches: [main]
    paths: ["store/**", "scripts/store-*.mjs", ".github/workflows/store-*.yml"]
  push:
    branches: [main]
    paths: ["store/**", "scripts/store-*.mjs", ".github/workflows/store-*.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Limites de la fiche App Store (fr-FR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/store-check.mjs
      - run: node --test scripts/store-push.test.mjs
      - run: node scripts/store-push.mjs --dry-run
