# Fiche App Store fr-FR (store/app-store/) : limites d'App Store Connect et directive 2.3.10 d'Apple, vérifiées sans
# runner macOS (scripts/store-check.mjs). L'envoi de la fiche par l'API App Store Connect viendra après A2–A3.
name: Fiche App Store — contrôle

on:
  pull_request:
    branches: [main]
    paths: ["store/**", "scripts/store-check.mjs", ".github/workflows/store-check.yml"]
  push:
    branches: [main]
    paths: ["store/**", "scripts/store-check.mjs", ".github/workflows/store-check.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Limites de la fiche App Store (fr-FR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - run: node scripts/store-check.mjs
