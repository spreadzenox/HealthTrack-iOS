<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pilou · esquisse 3 · Créature de film d'animation</title>
<style>
  @font-face { font-family: 'Figtree'; src: url('../_partage/fontsource-variable-figtree-5.3.0/files/figtree-latin-wght-normal.woff2') format('woff2'); font-weight: 300 900; }
  html, body { margin: 0; background: #1b120d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  #c { display: block; width: 1920px; height: 1080px; }
  #cart { position: absolute; left: 56px; bottom: 52px; padding: 11px 18px 12px; border-radius: 14px; background: rgba(255, 246, 236, .62);
    backdrop-filter: blur(6px); font: 600 21px/1.25 Figtree, Inter, sans-serif; color: #4A332B; letter-spacing: .01em; opacity: 1; }
  #cart small { display: block; font-weight: 500; font-size: 15px; color: #7A5A48; margin-top: 2px; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: rgba(0,0,0,.45); font: 14px Figtree, sans-serif; color: #fff; }
  #ui input { flex: 1; }
  #ui button { font: inherit; padding: 4px 12px; border-radius: 8px; border: 0; }
  body.render #ui { display: none; }
  body.petit #stage, body.petit #c { width: 420px; height: 360px; }
  body.petit #cart { display: none; }
  body.petit { background: #FFF1E2; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="cart">Esquisse 3 · Créature de film d'animation<small>Pilou et son île, à l'heure dorée</small></div></div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="10000" step="1" value="0"><span id="time">0,00 s</span></div>
<script type="importmap">{ "imports": { "three": "../_partage/three-0.187.0/build/three.module.js", "three/addons/": "../_partage/three-0.187.0/examples/jsm/" } }</script>
<script type="module">
import { createWorld, DURATION } from './scene.js';
const Q = new URLSearchParams(location.search);
const render = Q.get('render') === '1', petit = Q.get('petit') === '1';
if (render) document.body.classList.add('render');
if (petit) document.body.classList.add('petit');
const cart = document.getElementById('cart');
let world;
window.DURATION = DURATION;
window.__ready = (async () => {
  await document.fonts.ready;
  world = await createWorld(document.getElementById('c'), petit ? { w: 420, h: 360 } : {});
  return true;
})();
window.seek = ms => {
  if (!world) return;
  cart.style.opacity = String(1 - Math.min(1, Math.max(0, (ms - 1500) / 450)));
  world.frame(ms);
};
window.info = () => world.stats();
window.timeFrame = ms => { const t0 = performance.now(); window.seek(ms); const gl = world.R.getContext(); const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return performance.now() - t0; };
if (!render) {
  await window.__ready;
  const scrub = document.getElementById('scrub'), play = document.getElementById('play'), time = document.getElementById('time');
  let playing = true, t = 0, last = performance.now();
  play.onclick = () => { playing = !playing; play.textContent = playing ? 'Pause' : 'Lecture'; last = performance.now(); };
  scrub.oninput = () => { t = +scrub.value; window.seek(t); };
  const loop = now => { if (playing) { t = (t + (now - last)) % DURATION; window.seek(t); scrub.value = t; time.textContent = (t / 1000).toFixed(2).replace('.', ',') + ' s'; } last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
